name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 注意：不要装已下架的旧 `tools` 包（setup-android 的默认 packages 含它，sdkmanager 会报 Failed to find package 'tools' 而失败）
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 固定签名：keystore 与密码存在仓库 secrets 里（SIGNING_KEYSTORE_B64 等），
      # 每次 CI 都用同一把钥匙签 debug 包，手机才能直接覆盖安装，不用先卸载。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          printf 'keystore.password=%s\nkey.alias=%s\nkey.password=%s\nkeystore.path=release.keystore\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # 应用内更新用的版本描述：App 启动时拉这个文件，比对 versionCode 决定是否提示更新
      - name: Write version.json
        run: |
          VC=$(grep -m1 'versionCode =' app/build.gradle.kts | grep -o '[0-9]*')
          VN=$(grep -m1 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          printf '{"versionCode":%s,"versionName":"%s","apkName":"app-debug.apk"}\n' "$VC" "$VN" > version.json
          cat version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorClicker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling CI release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-debug
          name: CI 最新构建（debug）
          body: 由 GitHub Actions 在每次推送到 main 后自动构建的 debug 包（固定签名，可直接覆盖安装）。装上后按 App 内顺序完成：开启无障碍 → 授权悬浮窗 → 授权截屏并启动。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            version.json
          fail_on_unmatched_files: true
